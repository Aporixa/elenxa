# Elenxa — hardened local deployment.
#
# - elenxa is built locally from this repo (`docker compose build`); no registry image.
# - Host-side ports are bound to 127.0.0.1 only.
# - postgres is NOT published to the host; it is reachable only on the compose network.
# - POSTGRES_PASSWORD must be set in .env (install.sh generates a random one).
name: elenxa
services:
  postgres:
    # Same major version as before (16), pinned by digest (resolved 2026-11-17).
    # Note: switching an existing pgdata volume from postgres:16-alpine (musl) to
    # this glibc image can affect text collation; REINDEX if you migrate old data.
    image: postgres:16-bookworm@sha256:a49f7438ba03589f9b1ca062f2da82e899b48ea1dc50d2449fa09a70be83ebca
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-elenxa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (run ./install.sh to generate one)}
      POSTGRES_DB: ${POSTGRES_DB:-elenxa}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-elenxa} -d ${POSTGRES_DB:-elenxa}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  elenxa:
    build: .
    # Default: build the working tree as elenxa:local. To run a different,
    # already-built image (e.g. the Chinese-language build) without rebuilding:
    #   ELENXA_IMAGE=elenxa:zh ELENXA_PULL_POLICY=never docker compose up -d --no-build
    # With egress locked, also start the English image this way
    # (ELENXA_PULL_POLICY=never ... --no-build); pull_policy=build otherwise hangs
    # trying to reach the registry. Use fresh volumes when switching images:
    # prompts are seeded into the DB on first start only.
    image: ${ELENXA_IMAGE:-elenxa:local}
    pull_policy: ${ELENXA_PULL_POLICY:-build}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ELENXA_PG_DSN: postgres://${POSTGRES_USER:-elenxa}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-elenxa}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ELENXA_LLM_PROVIDER: ${ELENXA_LLM_PROVIDER:-}
      ELENXA_LLM_MODEL: ${ELENXA_LLM_MODEL:-}
      ELENXA_LLM_BASE_URL: ${ELENXA_LLM_BASE_URL:-}
      ELENXA_LLM_PROXY: ${ELENXA_LLM_PROXY:-}
      ELENXA_ALLOWED_HOSTS: ${ELENXA_ALLOWED_HOSTS:-}
      ELENXA_DNS_RESOLVERS: ${ELENXA_DNS_RESOLVERS:-}
    ports:
      # Localhost only. To reach it from another machine use an SSH tunnel
      # (ssh -L 8787:127.0.0.1:8787 host) rather than widening these binds.
      - "127.0.0.1:8787:8787"
      - "127.0.0.1:8788:8788"
    # nmap SYN/ICMP scans as the non-root `elenxa` user rely on a CAP_NET_RAW file
    # capability (see Dockerfile). NET_RAW is in Docker's default set; it is
    # listed explicitly so the dependency is visible and survives a stricter
    # default cap set.
    cap_add:
      - NET_RAW
    # Docker's bundled init (tini) runs as PID 1 and reaps orphaned processes —
    # e.g. Chromium helpers left behind when the browser MCP stops — which the
    # elenxa server itself does not do.
    init: true
    volumes:
      # Workspace / data dir. Named volumes inherit the image's ownership (uid
      # 10001) on first creation; a host bind mount would need `chown 10001:10001`.
      - elenxa-data:/app/data
      # jwt.key + first-run setup-token (mode 0700, not browsable from the UI).
      - elenxa-keys:/app/keys
      # Project skills mounted over the image copy; edit on the host, no rebuild
      # needed. To create/edit skills from the web UI the container user must be
      # able to write here: `chown -R 10001:10001 skills` (or append :ro to make
      # it explicitly read-only).
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
  elenxa-data:
  elenxa-keys:
